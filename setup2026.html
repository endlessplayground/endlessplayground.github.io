<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Site</title>


    <style>
        /* ---------- RESET ---------- */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* ---------- PAGE ---------- */


body {

    min-height: 100vh;

    background: #bcf46d;

    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: system-ui, sans-serif;
    color: rgb(46, 64, 86);

}


/* ---------- HEADER ---------- */

#top-mus {
    position: fixed;
    display: flex;
    justify-content: center;
    width: 100%;
    top: 7px;
    right: 130px;
    z-index: 2;
}
#top-mus img {
    width: 320px;
}

#avontuur {
    position: fixed;
    display: flex;
    justify-content: center;
    width: 100%;
    top: 0px;
    left: 11px;
    z-index: 1;
}
#avontuur img {
    width: 379px;
}

header {
    position: fixed;
    width: 100%;
    height: 66px;

    display: flex;
    justify-content: center;
    align-items: center;

}


/* ---------- MAIN ---------- */


main {

    width: 100%;
    max-width: 430px;

    flex: 1;

    background: rgb(249, 250, 242);

    display: flex;
    justify-content: center;
    align-items:center;

    padding: 170px 20px 70px 20px;

    background: linear-gradient(
    to bottom,
    #35a2bb 0,
    white 150px,
    white 100%
);

    

}


/* ---------- GRID ---------- */

.menu-grid {

    width: 100%;
    max-width: 350px;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 5px 30px;
}


/* ---------- MENU ITEMS ---------- */

.menu-grid a {

    text-decoration: none;

    display: flex;
    flex-direction: column;
    align-items: center;
    color: rgb(46, 64, 86);
}
span {
    height: 40px;
    text-align: center;
    overflow: visible;
    line-height: 1rem;
}


/* ---------- ROUND IMAGE PLACEHOLDER ---------- */

.icon, .icon-empty {

    width: 70px;
    height: 70px;
    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background: #d9e8e4;

    margin-bottom: 4px;
}

.icon-empty {
    background: hsl(164, 25%, 92%);
}


/* ---------- FOOTER ---------- */

footer {

    width: 100%;

    height: 40px;

    background: transparent;

    position: fixed;
    bottom: 0;

}
    </style>
</head>

<body>

    <div id="avontuur"><img src="images/avontuur.svg" alt="mus"></div>
    <div id="top-mus"><img src="images/mus.svg" alt="mus"></div>

    <header>
        <div class="logo">
            
        </div>
    </header>

    <main>

        <nav class="menu-grid">

            <a href="#">
                <div class="icon-empty"></div>
                <span></span>
            </a>

            <a href="#">
                <div class="icon"><img src="images/mij.svg" alt=""></div>
                <span>Wie is die mus?</span>
            </a>

            <a href="#">
                <div class="icon-empty"></div>
                <span></span>
            </a>

<!-- ----------------------------------
...

            <a href="#">

            <a href="#">

                <span></span>
            </a>

            <a href="#">
                <div class="icon"></div>
                <span></span>
            </a>

<!-- ----------------------------------- -->

            <a href="#">
                <div class="icon-empty"></div>
                <span></span>
            </a>

            <a href="#">
                <div class="icon"></div>
                <span>Projecten</span>
            </a>

            <a href="#">
                <div class="icon"></div>
                <span></span>
            </a>

<!-- ----------------------------------- -->
            
            <a href="#">
                <div class="icon"></div>
                <span>Random</span>
            </a>

            <a href="#">
                <div class="icon-empty"></div>

            <a href="#">

            </a>

            <a href="#">

            </a>

        </nav>

</body>

</html>
