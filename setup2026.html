    <style>
        /* ---------- RESET ---------- */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* ---------- PAGE ---------- */

body {

    min-height: 100vh;

    background: #bcf46d;

    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: system-ui, sans-serif;
}


/* ---------- HEADER ---------- */

#top-mus {
    position: fixed;
    display: flex;
    justify-content: center;
    width: 100%;
    top: 20px;
    right: 85px;
    z-index: 2;
}
#top-mus img {
    width: 300px;
}

#avontuur {
    position: fixed;
    display: flex;
    justify-content: center;
    width: 100%;
    top: 2px;
    left: 42px;
    z-index: 1;
}
#avontuur img {
    width: 350px;
}

header {

    width: 100%;

    height: 70px;

    background: hsl(34, 95%, 55%);
    background: #35a1ba;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
}


/* ---------- MAIN ---------- */


main {

    width: 100%;
    max-width: 430px;

    flex: 1;

    background: white;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    padding: 30px 20px;

}


/* ---------- GRID ---------- */

.menu-grid {

    width: 100%;
    max-width: 350px;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 20px;
}


/* ---------- MENU ITEMS ---------- */

.menu-grid a {

    text-decoration: none;

    color: black;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* ---------- ROUND IMAGE PLACEHOLDER ---------- */

.icon {

    width: 70px;
    height: 70px;

    border-radius: 50%;

    background: #d9e2e8;

    margin-bottom: 10px;
}


/* ---------- FOOTER ---------- */

footer {

    width: 100%;

    height: 40px;

    background: transparent;

    position: fixed;
    bottom: 0;

}
    </style>
</head>
