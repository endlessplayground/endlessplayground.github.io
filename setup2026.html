<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Site</title>


    <style>
        /* ---------- RESET ---------- */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* ---------- PAGE ---------- */


body {

    min-height: 100vh;

    background: #bcf46d;

    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: system-ui, sans-serif;
    color: rgb(46, 64, 86);

    font-family: "Alegreya Sans", sans-serif;
    font-weight: 400;
    font-style: normal;

}


/* ---------- HEADER ---------- */

#top-mus {
    position: fixed;
    display: flex;
    justify-content: center;
    width: 100%;
    top: 27px;
    right: 130px;
    z-index: 2;
}
#top-mus img {
    width: 270px;
}

#avontuur {
    position: fixed;
    display: flex;
    justify-content: center;
    width: 100%;
    top: 0px;
    left: 33px;
    z-index: 1;
}
#avontuur img {
    width: 451  px;
}

header {
    position: fixed;
    width: 100%;
    height: 166px;

    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(
    to bottom,
    rgba(53, 162, 187, 0.99) 0,
    rgba(151, 214, 228, 0.99) 60%,
    transparent 100%
);
}


/* ---------- MAIN ---------- */


main {

    width: 100%;
    max-width: 430px;

    flex: 1;

    display: flex;
    justify-content: center;
    align-items:center;

    background-color:rgb(244, 244, 230);

    padding: 170px 20px 70px 20px;
}


/* ---------- GRID ---------- */

.menu-grid {

    width: 100%;
    max-width: 350px;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 5px 30px;
}


/* ---------- MENU ITEMS ---------- */

.menu-grid a {

    text-decoration: none;

    display: flex;
    flex-direction: column;
    align-items: center;
    color: rgb(46, 64, 86);
}
.label {
    height: 40px;
    text-align: center;
    overflow: visible;
    line-height: 1rem;
}


/* ---------- ROUND IMAGE PLACEHOLDER ---------- */

.icon, .icon-empty {

    width: 70px;
    height: 70px;
    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background-color: rgba(175, 222, 209, 0.5);

    margin-bottom: 4px;
}

.icon-empty {
    background-color: rgba(175, 222, 209, 0.3);
}


/* ---------- FOOTER ---------- */

footer {

    width: 100%;

    height: 40px;

    background: transparent;

    position: fixed;
    bottom: 0;

}
    </style>
</head>

<body>

    <div id="avontuur"><img src="images/avontuur.svg" alt="mus"></div>
    <div id="top-mus"><img src="images/mus.svg" alt="mus"></div>

    <header>
        <div class="logo">
            
        </div>
    </header>

    <main>

        <nav class="menu-grid">

            <a href="#">
                <div class="icon-empty"></div>
                <div class="label"><span></span></div>
            </a>

            <a href="#">
                <div class="icon"><img src="images/mij.svg" alt=""></div>
                <div class="label"><span>Wie is die mus?</span></div>
            </a>

            <a href="#">
                <div class="icon-empty"></div>
                <div class="label"><span></span></div>
            </a>

<!-- ---------------------------------- -->

            <a href="#">
                <div class="icon"><img src="images/ideeen.svg" alt=""></div>
                <div class="label"><span>Ideeën</span></div>
            </a>

            <a href="#">
                <div class="icon-empty"></div>
                <div class="label"><span></span></div>
            </a>

            <a href="#">
                <div class="icon"><img src="images/koffie.svg" alt=""></div>
                <div class="label"><span>Koffie?</span></div>
            </a>

<!-- ----------------------------------- -->

            <a href="#">
                <div class="icon-empty"></div>
                <div class="label"><span></span></div>
            </a>

            <a href="#">
                <div class="icon"><img src="images/projecten.svg" alt=""></div>
                <div class="label"><span>Projecten</span></div>
            </a>

            <a href="#">
                <div class="icon"></div>
                <div class="label"><span></span></div>
            </a>

<!-- ----------------------------------- -->
            
            <a href="#">
                <div class="icon"><img src="images/random.svg" alt=""></div>
                <div class="label"><span style="display:inline-block; transform:rotate(180deg);">Random</span></div>
    

            </a>

            <a href="#">
                <div class="icon-empty"></div>
                <div class="label"><span></span></div>
            </a>

            <a href="#">
                <div class="icon"><img src="images/contact.svg" alt=""></div>
                <div class="label"><span>Contact</span></div>
            </a>

<!-- -----------------------------------


            <a href="#">
                <div class="icon-empty"></div>
                <div class="label"><span></span></div>
            </a>

            <a href="#">
                <div class="icon"></div>
                <span>Contact</span>
            </a>

            <a href="#">
                <div class="icon-empty"></div>
                <div class="label"><span></span></div>
            </a>
            
-->



        </nav>

    </main>

    <footer>
    </footer>

</body>

</html>
