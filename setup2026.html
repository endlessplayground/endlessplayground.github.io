<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Site</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* ---------- RESET ---------- */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* ---------- PAGE ---------- */


body {

    min-height: 100vh;

    background: #bcf46d;

    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: system-ui, sans-serif;
    color: rgb(46, 64, 86);

}


/* ---------- HEADER ---------- */

#top-mus {
    position: fixed;
    display: flex;
    justify-content: center;
    width: 100%;
    top: 10px;
    right: 130px;
    z-index: 2;
}
#top-mus img {
    width: 320px;
}

#avontuur {
    position: fixed;
    display: flex;
    justify-content: center;
    width: 100%;
    top: 0px;
    left: 40px;
    z-index: 1;
}
#avontuur img {
    width: 350px;
}

header {

    width: 100%;

    height: 66px;

    background: hsl(34, 95%, 55%);
    background: hsl(191, 56%, 47%);

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
}


/* ---------- MAIN ---------- */


main {

    width: 100%;
    max-width: 430px;

    flex: 1;

    background: rgb(249, 250, 242);

    display: flex;
    justify-content: center;
    align-items:center;

    padding: 30px 20px;
    

}


/* ---------- GRID ---------- */

.menu-grid {

    width: 100%;
    max-width: 350px;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 20px;
}


/* ---------- MENU ITEMS ---------- */

.menu-grid a {

    text-decoration: none;

    display: flex;
    flex-direction: column;
    align-items: center;
    color: inherit;
}


/* ---------- ROUND IMAGE PLACEHOLDER ---------- */

.icon, .icon-empty {

    width: 70px;
    height: 70px;

    border-radius: 50%;

    background: #d9e8e4;

    margin-bottom: 4px;
}

.icon-empty {
    background: hsl(164, 25%, 92%);
}


/* ---------- FOOTER ---------- */

footer {

    width: 100%;

    height: 40px;

    background: transparent;

    position: fixed;
    bottom: 0;

}
    </style>
</head>

<body>

    <div id="avontuur"><img src="images/avontuur.png" alt="mus"></div>
    <div id="top-mus"><img src="images/mus.png" alt="mus"></div>

    <header>
        <div class="logo">
            
        </div>
    </header>

    <main>

        <nav class="menu-grid">

            <a href="#">
                <div class="icon-empty"></div>
                <span></span>
            </a>

            <a href="#">
                <div class="icon"></div>
                <span></span>
            </a>

            <a href="#">
                <div class="icon-empty"></div>
                <span></span>
            </a>

<!--------------------------------------->

            <a href="#">
                <div class="icon"></div>
                <span></span>
            </a>

            <a href="#">
                <div class="icon-empty"></div>
                <span></span>
            </a>

            <a href="#">
                <div class="icon"></div>
                <span></span>
            </a>

<!--------------------------------------->

            <a href="#">
                <div class="icon-empty"></div>
                <span></span>
            </a>

            <a href="#">
                <div class="icon"></div>
                <span></span>
            </a>

            <a href="#">
                <div class="icon"></div>

            </a>

<!--------------------------------------->
            
            <a href="#">
                <div class="icon"></div>
                <span> </span>

                <div class="icon"></div>
                <span></span>
            </a>

            <a href="#">
                <div class="icon-empty"></div>
                <span></span>
            </a>





        </nav>

    </main>

    <footer>

</body>

</html>
