<div class="header-bar">
    <div id="avontuur"><img src="{{ '/images/avontuur.svg' | relative_url }}" alt="Op avontuur"></div>

    {% if page.page_type == "home" %}
        <div id="top-mus"><img src="{{ '/images/mus.svg' | relative_url }}" alt="Mus"></div>
    {% endif %}


    {% if page.page_type != "home" %}
    <div id="top-icon"><img src="{{ '/images/' | append: page.parent_folder | append: '.svg' | relative_url }}" alt="">
    </div>
    {% endif %}

    {% if page.parent_folder == "today" %}
    <div id="top-icon">
  <div class="date">
    <div id="month"></div>
    <div id="date"></div>
  </div>
  </div>
    </div>

    {% endif %}


</div>
